<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5A5E">
<meta name="description" content="Caderneta — o histórico de manutenção do seu carro, no bolso.">
<title>Caderneta</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F8F6; --surface-3:#E7EEEB;
  --line:#D6E1DD; --line-strong:#BECBC6;
  --ink:#0F1917; --ink-2:#3A4B47; --muted:#6A807B;
  --accent:#0E5A5E; --accent-ink:#0B4649; --accent-soft:#DAEAE9; --on-accent:#FFFFFF;
  --ok:#2C7A4C; --ok-soft:#DCEDE2;
  --warn:#9C6206; --warn-soft:#F6E9D2;
  --crit:#A93A2B; --crit-soft:#F6DFDB;
  --shadow:0 1px 2px rgba(15,25,23,.05), 0 8px 24px -14px rgba(15,25,23,.28);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --f-display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1211; --surface:#141F1D; --surface-2:#1A2724; --surface-3:#22302C;
    --line:#26332F; --line-strong:#35443F;
    --ink:#E7EEEB; --ink-2:#BDCCC7; --muted:#879E99;
    --accent:#4BBBB1; --accent-ink:#7FD6CD; --accent-soft:#12312F; --on-accent:#06201F;
    --ok:#5FBB88; --ok-soft:#122C20;
    --warn:#D9A245; --warn-soft:#2E2413;
    --crit:#E0806F; --crit-soft:#321B17;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1211; --surface:#141F1D; --surface-2:#1A2724; --surface-3:#22302C;
  --line:#26332F; --line-strong:#35443F;
  --ink:#E7EEEB; --ink-2:#BDCCC7; --muted:#879E99;
  --accent:#4BBBB1; --accent-ink:#7FD6CD; --accent-soft:#12312F; --on-accent:#06201F;
  --ok:#5FBB88; --ok-soft:#122C20;
  --warn:#D9A245; --warn-soft:#2E2413;
  --crit:#E0806F; --crit-soft:#321B17;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:520px;margin:0 auto;padding:0 14px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;
  font-weight:600;font-size:12px;color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:520px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;
  text-transform:uppercase;line-height:1;white-space:nowrap}
.brand span{color:var(--accent);margin:0 .18em}
.veh-pick{flex:1;min-width:0;display:flex;justify-content:flex-end}
.veh-btn{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px 5px 8px;max-width:100%;box-shadow:var(--shadow)}
.veh-btn b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:104px}
.plate{font-family:var(--f-mono);font-weight:600;font-size:10.5px;letter-spacing:.06em;
  background:var(--surface-3);border-radius:4px;padding:2px 5px;color:var(--ink-2)}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px;padding:14px 0 4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -2px}
.sec-h h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;
  font-size:14px;font-weight:600;margin:0;color:var(--ink-2)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:600}

/* odometer card */
.odo{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.odo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.odo-name{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;
  text-transform:uppercase;letter-spacing:.01em}
.odo-sub{color:var(--muted);font-size:13px;margin-top:2px}
.odo-km{display:flex;align-items:flex-end;gap:8px}
.odo-km b{font-family:var(--f-mono);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.02em}
.odo-km small{color:var(--muted);font-size:13px;padding-bottom:4px}
.odo-strip{display:flex;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.odo-strip div{flex:1;min-width:0;background:var(--surface-2);padding:9px 8px}
.odo-strip .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-family:var(--f-display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odo-strip .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odo-strip .v{font-family:var(--f-mono);font-weight:600;font-size:15px;margin-top:1px}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.alert.crit{background:var(--crit-soft);border-color:transparent} .alert.crit .dot{background:var(--crit)}
.alert.warn{background:var(--warn-soft);border-color:transparent} .alert.warn .dot{background:var(--warn)}
.alert b{font-weight:600}
.alert .m{font-size:12.5px;color:var(--ink-2);margin-top:1px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;text-align:left;width:100%;
  background:none;border:0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.row .when{flex:none;width:42px;text-align:center;padding-top:1px;display:block}
.row .when .d{display:block;font-family:var(--f-mono);font-weight:600;font-size:15px;line-height:1}
.row .when .m{display:block;font-family:var(--f-display);text-transform:uppercase;font-size:10.5px;
  letter-spacing:.08em;color:var(--muted);margin-top:2px}
.row .body{flex:1;min-width:0;display:block}
.row .t{display:block;font-weight:600;line-height:1.25}
.row .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{flex:none;text-align:right;font-family:var(--f-mono);font-weight:600;font-size:14px;padding-top:1px}
.row .val .kml{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.row .pill{flex:none;align-self:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-ink);
  font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  font-size:11px;padding:2px 7px;border-radius:5px;vertical-align:1px}
.pill{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

.month-h{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:12px;
  font-weight:600;color:var(--muted);display:flex;justify-content:space-between;
  padding:14px 2px 6px;align-items:baseline}
.month-h .num{font-size:12.5px;color:var(--ink-2)}

/* empty */
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink);font-size:17px;margin:0 0 5px}
.empty p{margin:0 auto 14px;max-width:34ch;font-size:13.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;
  padding:11px 16px;font-weight:600;font-size:15px;border:1px solid transparent;background:var(--surface-3);
  color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.block{width:100%}

/* fab + tabbar */
.fab{position:fixed;right:max(14px,calc(50% - 246px));
  bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;
  width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(14,90,94,.55)}
.fab svg{width:26px;height:26px;stroke-width:2.1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted)}
.tab span{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;
  font-size:11px;font-weight:600}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{stroke-width:2.1}

/* charts */
.bars{display:flex;flex-direction:column;gap:11px;padding:14px}
.bar-row .lab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-size:13px;margin-bottom:4px}
.bar-row .lab .n{font-weight:500}
.bar-row .lab .v{font-family:var(--f-mono);font-weight:600;font-size:13px}
.bar-row .lab .p{color:var(--muted);font-size:11.5px;font-family:var(--f-mono)}
.track{height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.cols{display:flex;align-items:flex-end;gap:2px;height:118px;padding:14px 12px 0}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:none;
  border:0;padding:0;gap:0}
.col i{display:block;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px;
  opacity:.55}
.col[aria-pressed="true"] i{opacity:1}
.col-x{display:flex;gap:2px;padding:6px 12px 12px}
.col-x span{flex:1;text-align:center;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.chart-cap{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chart-cap .k{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;
  font-size:12px;font-weight:600;color:var(--muted)}
.chart-cap .v{font-family:var(--f-mono);font-weight:600;font-size:14px}

/* filters */
.filters{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px}
.search input{border:0;background:none;width:100%;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.frow{display:flex;gap:8px}
.frow > *{flex:1;min-width:0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field > label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;
  font-size:11.5px;font-weight:600;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=url],input[type=number],input[type=password],input[type=email],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:12px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 49%,var(--muted) 50%),linear-gradient(-45deg,transparent 49%,var(--muted) 50%);
  background-size:6px 6px,6px 6px;background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;
  background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:74px;resize:vertical}
.money{position:relative}
.money input{padding-left:36px;font-family:var(--f-mono);font-weight:600}
.money::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.kminput input{font-family:var(--f-mono);font-weight:600}
.total-box{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--accent-soft);border-radius:var(--r);padding:12px 14px}
.total-box .k{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;
  font-size:12px;font-weight:600;color:var(--accent-ink)}
.total-box .v{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,18,16,.5);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:94vh;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;box-shadow:0 -12px 40px -16px rgba(0,0,0,.5)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;
  font-size:19px;font-weight:700;margin:0;flex:1}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;
  display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  background:var(--surface);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;background:var(--surface);border:0;
  border-top:1px solid var(--line);padding:13px 14px;text-align:left}
.menu-item:first-child{border-top:0}
.menu-item .t{flex:1;font-weight:500}
.menu-item[aria-current="true"] .t{color:var(--accent);font-weight:600}

.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.det-grid div{background:var(--surface);padding:10px 12px}
.det-grid .k{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;
  font-size:10.5px;font-weight:600;color:var(--muted)}
.det-grid .v{font-weight:500;margin-top:1px}
.det-grid .v.num{font-weight:600}
.wide{grid-column:1/-1}

/* foto do comprovante */
.photo-slot{border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--surface-2);
  padding:14px;display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:var(--ink-2)}
.photo-slot .t{flex:1;font-size:13.5px}
.photo-slot .t b{display:block;font-weight:600;color:var(--ink);font-size:14.5px}
.photo-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2)}
.photo-wrap img{display:block;width:100%;height:auto}
.photo-wrap .rm{position:absolute;top:8px;right:8px;background:rgba(8,18,16,.72);color:#fff;border:0;
  border-radius:9px;width:32px;height:32px;display:grid;place-items:center}
.photo-ph{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.camtag{display:inline-flex;vertical-align:-2px;margin-left:5px;color:var(--accent)}
.camtag svg{width:13px;height:13px;stroke-width:1.9}

/* base de dados */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface)}
table.db{border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.db th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:11px;
  font-weight:600;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);
  background:var(--surface-2);position:sticky;top:0}
table.db td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-2)}
table.db tr:last-child td{border-bottom:0}
table.db td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
table.db td.strong{color:var(--ink);font-weight:500}

.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);
  border-radius:var(--r);padding:10px 12px;font-size:13px}
.banner b{color:var(--ink)}
.banner .btn{padding:7px 12px;font-size:13px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;
  font-weight:500;box-shadow:var(--shadow);max-width:90vw;text-align:center}
/* login */
.auth{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:22px;overflow-y:auto}
.auth-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:13px}
.auth h1{font-family:var(--f-display);text-transform:uppercase;font-size:32px;margin:0;
  letter-spacing:.02em;line-height:1}
.auth h1 span{color:var(--accent)}
.auth .sub{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.auth .erro{background:var(--crit-soft);color:var(--crit);padding:10px 12px;
  border-radius:var(--r);font-size:13px}
.auth .alt{text-align:center;font-size:13.5px;color:var(--muted);margin:2px 0 0}
.btn[disabled]{opacity:.55}
.conv-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.conv-item:first-child{border-top:0}
.conv-item code{flex:1;font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.04em}
.sync{font-size:11.5px;color:var(--muted);text-align:center;padding:16px 0 6px}
</style>
</head>
<body>

<div class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <div>
      <h1>Cader<span>neta</span></h1>

  if(!r.ok)throw new Error((corpo&&corpo.erro)||"Não foi possível concluir. Tente de novo.");

/* ============================== fotos dos comprovantes ============================== */
const MAX_FOTO=2000000; // caracteres da data URL — o servidor aceita até 3 MB de imagem
function comprimirFoto(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("leitura"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("imagem"));
      img.onload=()=>{
        const desenhar=(lado,q)=>{
          const e=Math.min(1,lado/Math.max(img.width,img.height));
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*e));c.height=Math.max(1,Math.round(img.height*e));
          const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img,0,0,c.width,c.height);
          return c.toDataURL("image/jpeg",q);
        };
        let out=desenhar(1600,.78);
        const passos=[[1600,.66],[1300,.62],[1000,.58],[800,.5]];
        for(let i=0;i<passos.length&&out.length>MAX_FOTO;i++)out=desenhar(passos[i][0],passos[i][1]);
        if(out.length>MAX_FOTO){reject(new Error("grande"));return;}
        resolve(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* Object URL sem revoke fica preso na memória do navegador até a aba fechar. */
function esquecerFoto(id){

}
/* A imagem vem pela rota autenticada; a URL do armazenamento nunca chega ao navegador. */

  try{

    if(!r.ok)return null;
    const url=URL.createObjectURL(await r.blob());

  }catch(e){return null;}
}

/* ============================== cálculos ============================== */
function proximaStatus(m,veh){
  // devolve {nivel:"crit"|"warn"|"ok", texto, ordem}
  const kmAtual=veh.kmAtual||0, hoje=today();
  let porKm=null, porData=null;
  if(m.proximaKm){
    const falta=m.proximaKm-kmAtual;
    porKm={falta:falta, texto:falta<=0?("vencida há "+km(Math.abs(falta))):("faltam "+km(falta)),
      nivel:falta<=0?"crit":(falta<=1000?"warn":"ok"), ordem:falta};
  }
  if(m.proximaData){
    const d=daysBetween(m.proximaData,hoje);
    porData={falta:d, texto:d<0?("vencida há "+Math.abs(d)+" dia"+(Math.abs(d)===1?"":"s")):
      (d===0?"vence hoje":("faltam "+d+" dia"+(d===1?"":"s"))),
      nivel:d<0?"crit":(d<=30?"warn":"ok"), ordem:d*20};
  }
  if(!porKm&&!porData)return null;
  const rank={crit:0,warn:1,ok:2};
  let pior = porKm&&porData ? (rank[porKm.nivel]<=rank[porData.nivel]?porKm:porData) : (porKm||porData);
  return {nivel:pior.nivel, texto:pior.texto, ordem:pior.ordem, porKm:porKm, porData:porData};
}
function proximas(veh){
  const out=[];
  maintsOf(veh.id).forEach(m=>{
    const st=proximaStatus(m,veh);
    if(st)out.push({m:m,st:st});
  });
  out.sort((a,b)=>a.st.ordem-b.st.ordem);
  return out;
}
function totals(list){
  let t=0;list.forEach(m=>t+=Number(m.valorTotal)||0);return t;
}
/* Tanque cheio a tanque cheio: os litros de parciais entram no próximo cheio.
   A média divide distância total por litros totais, sem enviesar para trechos curtos.

   Sem nenhum par de tanques cheios, estima pela série inteira: o combustível que
   levou do primeiro ao último abastecimento é o que foi colocado depois do primeiro,
   errando só pela diferença de nível do tanque nas duas pontas. Esse erro é limitado
   pelo tamanho do tanque e não cresce — os litros acumulados sim, então a estimativa
   fica mais precisa sozinha. */
function consumos(vid){
  const lista=refuelsOf(vid);
  const porId={}, trechos={};
  let baseKm=null, baseData=null, litrosAcum=0, valorAcum=0, nAcum=0;
  let dist=0, litros=0, valor=0;
  lista.forEach(r=>{
    if(baseKm!=null){litrosAcum+=r.litros||0;valorAcum+=r.valorTotal||0;nAcum++;}
    if(!r.tanqueCheio)return;
    if(baseKm!=null&&r.km>baseKm&&litrosAcum>0){
      porId[r.id]=(r.km-baseKm)/litrosAcum;
      trechos[r.id]={de:baseData,ate:r.data,dist:r.km-baseKm,litros:litrosAcum,n:nAcum};
      dist+=r.km-baseKm;litros+=litrosAcum;valor+=valorAcum;
    }
    baseKm=r.km;baseData=r.data;litrosAcum=0;valorAcum=0;nAcum=0;
  });

  const est={dist:0,litros:0,valor:0,n:lista.length,media:0,pronta:false,faltaN:0,faltaKm:0};
  if(lista.length>=2){
    est.dist=(lista[lista.length-1].km||0)-(lista[0].km||0);
    for(let i=1;i<lista.length;i++){est.litros+=lista[i].litros||0;est.valor+=lista[i].valorTotal||0;}
    if(est.dist>0&&est.litros>0)est.media=est.dist/est.litros;
  }
  est.faltaN=Math.max(0,MIN_AB_ESTIMATIVA-lista.length);
  est.faltaKm=Math.max(0,MIN_KM_ESTIMATIVA-est.dist);
  est.pronta=est.media>0&&!est.faltaN&&!est.faltaKm;

  return {porId:porId, trechos:trechos, dist:dist, litros:litros,
    media:litros?dist/litros:0, custoKm:dist?valor/dist:0, est:est};
}

/* ============================== render ============================== */
function renderSync(){
  const el=$("#syncline");
  if(!el)return;
  el.innerHTML=usuario
    ? esc(usuario.email)+' · <button class="link" id="sairLink">sair</button>'
    : "";
  const b=$("#sairLink");if(b)b.onclick=sair;
}
function render(){
  renderHeader(); renderTabs();
  const v=$("#view");
  const veh=activeVehicle();
  if(!veh){ v.innerHTML=viewOnboarding(); bindOnboarding(); return; }
  if(tab==="resumo")v.innerHTML=viewResumo(veh);
  else if(tab==="historico")v.innerHTML=viewHistorico(veh);
  else if(tab==="proximas")v.innerHTML=viewProximas(veh);
  else if(tab==="tanque")v.innerHTML=viewTanque(veh);
  else v.innerHTML=viewGastos(veh);
  bindView(veh);
  renderSync();
}
function renderHeader(){
  const veh=activeVehicle();
  $("#vehBtnName").textContent=veh?veh.nome:"Sem veículo";
  $("#vehBtnPlate").textContent=veh&&veh.placa?veh.placa:"—";
  $("#vehBtnPlate").style.display=veh&&veh.placa?"":"none";
}
function renderTabs(){
  const tabs=[["resumo","Resumo"],["historico","Histórico"],["proximas","Próximas"],["gastos","Gastos"],["tanque","Tanque"]];
  $("#tabbar").innerHTML=tabs.map(([k,l])=>
    '<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(tab===k)+'">'+svg(k)+'<span>'+l+'</span></button>'
  ).join("");
  $("#tabbar").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;colSel=null;render();window.scrollTo(0,0);});
}

/* -------- resumo -------- */
function viewResumo(veh){
  const list=maintsOf(veh.id);
  const refs=refuelsOf(veh.id);
  const total=totals(list), totalComb=totals(refs);
  const kms=list.concat(refs).map(m=>m.km||Infinity);
  const kmIni=veh.kmInicial!=null&&veh.kmInicial!==""?Number(veh.kmInicial):
    (kms.length?Math.min.apply(null,kms):null);
  const rodados=(kmIni!=null&&isFinite(kmIni))?Math.max(0,(veh.kmAtual||0)-kmIni):0;
  const porKm=rodados>0?(total+totalComb)/rodados:0;
  const prox=proximas(veh).filter(p=>p.st.nivel!=="ok").slice(0,3);
  const ultimos=list.slice(0,4);

  let h='<div class="stack">';

  h+='<section class="card odo">'+
    '<div class="odo-top"><div style="min-width:0">'+
      '<div class="odo-name">'+esc(veh.nome)+'</div>'+
      '<div class="odo-sub">'+esc([veh.marca,veh.modelo,veh.ano].filter(Boolean).join(" · "))+'</div>'+
    '</div>'+
    '<button class="icon-btn" id="editVeh" aria-label="Editar veículo">'+svg("edit")+'</button></div>'+
    '<div class="odo-km"><b class="num">'+(veh.kmAtual||0).toLocaleString("pt-BR")+'</b><small>km no odômetro</small>'+
      '<button class="link" id="updKm" style="margin-left:auto">Atualizar</button></div>'+
    '<div class="odo-strip">'+
      '<div><div class="k">Manutenção</div><div class="v">'+brlShort(total)+'</div></div>'+
      '<div><div class="k">Combustível</div><div class="v">'+brlShort(totalComb)+'</div></div>'+
      '<div><div class="k">Custo/km</div><div class="v">'+(porKm?("R$ "+porKm.toFixed(2).replace(".",",")):"—")+'</div></div>'+
    '</div>'+
  '</section>';

  if(prox.length){
    h+='<div class="sec-h"><h2>Atenção</h2><button class="link" data-goto="proximas">Ver todas</button></div>';
    prox.forEach(p=>{
      h+='<div class="alert '+p.st.nivel+'"><span class="dot"></span><div>'+
        '<b>'+esc(p.m.servico)+'</b> <span class="chip">'+esc(CAT_LABEL[p.m.categoria]||"")+'</span>'+
        '<div class="m">'+esc(p.st.texto)+' · última em '+fmtDate(p.m.data)+' com '+km(p.m.km)+'</div>'+
      '</div></div>';
    });
  }

  h+='<div class="sec-h"><h2>Últimos lançamentos</h2>'+(list.length>4?'<button class="link" data-goto="historico">Ver tudo</button>':'')+'</div>';
  if(!list.length){
    h+='<div class="card empty"><h3>Nenhuma manutenção</h3><p>Toque no botão + para registrar a primeira.</p></div>';
  }else{
    h+='<section class="card rows">'+ultimos.map(rowHtml).join("")+'</section>';
  }
  h+='<p class="sync" id="syncline"></p></div>';
  return h;
}
function rowHtml(m){
  const p=(m.data||"----------").split("-");
  return '<button class="row" data-open="'+m.id+'">'+
    '<span class="when"><span class="d">'+p[2]+'</span><span class="m">'+(MESES[+p[1]-1]||"")+'</span></span>'+
    '<span class="body"><span class="t">'+esc(m.servico)+'</span>'+
      '<span class="s">'+esc(CAT_LABEL[m.categoria]||"")+' · '+km(m.km)+(m.executadoPor?" · "+esc(m.executadoPor):"")+
      (m.temFoto?'<span class="camtag" aria-label="tem comprovante">'+svg("cam")+'</span>':'')+'</span></span>'+
    '<span class="val">'+brl(m.valorTotal)+'</span>'+
  '</button>';
}

/* -------- histórico -------- */
function applyFilters(list){
  const q=filters.q.trim().toLowerCase();
  const hoje=today();
  return list.filter(m=>{
    if(filters.cat!=="todas"&&m.categoria!==filters.cat)return false;
    if(filters.periodo!=="tudo"){
      const meses={"3m":3,"6m":6,"12m":12}[filters.periodo];
      if(meses&&daysBetween(hoje,m.data||hoje)>meses*31)return false;
    }
    const kmin=parseKm(filters.kmMin),kmax=parseKm(filters.kmMax);
    if(kmin!=null&&(m.km||0)<kmin)return false;
    if(kmax!=null&&(m.km||0)>kmax)return false;
    if(q){
      const blob=[m.servico,m.peca,m.marcaPeca,m.executadoPor,m.observacoes,CAT_LABEL[m.categoria]]
        .filter(Boolean).join(" ").toLowerCase();
      if(blob.indexOf(q)<0)return false;
    }
    return true;
  });
}
function viewHistorico(veh){
  const all=maintsOf(veh.id);
  const list=applyFilters(all);
  const cats=[["todas","Todas"]].concat(CATEGORIAS.filter(c=>all.some(m=>m.categoria===c.slug)).map(c=>[c.slug,c.label]));
  let h='<div class="stack">'+
    '<section class="card filters">'+
      '<div class="search">'+svg("historico")+'<input id="fq" type="text" inputmode="search" placeholder="Buscar serviço, peça, oficina…" value="'+esc(filters.q)+'"></div>'+
      '<div class="chips">'+cats.map(([k,l])=>'<button class="fchip" data-cat="'+k+'" aria-pressed="'+(filters.cat===k)+'">'+esc(l)+'</button>').join("")+'</div>'+
      '<div class="frow">'+
        '<select id="fper"><option value="tudo">Todo o período</option><option value="3m">Últimos 3 meses</option><option value="6m">Últimos 6 meses</option><option value="12m">Últimos 12 meses</option></select>'+
        '<input id="fkmin" type="text" inputmode="numeric" placeholder="km de" value="'+esc(filters.kmMin)+'">'+
        '<input id="fkmax" type="text" inputmode="numeric" placeholder="km até" value="'+esc(filters.kmMax)+'">'+
      '</div>'+
    '</section>';

  const filtrando=filters.q||filters.cat!=="todas"||filters.periodo!=="tudo"||filters.kmMin||filters.kmMax;
  h+='<div class="sec-h"><h2>'+list.length+' lançamento'+(list.length===1?"":"s")+'</h2>'+
     '<span class="num" style="font-size:13px;font-weight:600">'+brl(totals(list))+'</span></div>';

  if(!list.length){
    h+='<div class="card empty"><h3>'+(filtrando?"Nada com esses filtros":"Histórico vazio")+'</h3>'+
       '<p>'+(filtrando?"Ajuste a busca ou limpe os filtros.":"Toque no + para registrar a primeira manutenção.")+'</p>'+
       (filtrando?'<button class="btn ghost" id="fclear">Limpar filtros</button>':'')+'</div>';
  }else{
    const grupos=[];
    list.forEach(m=>{
      const ym=(m.data||"").slice(0,7);
      let g=grupos[grupos.length-1];
      if(!g||g.ym!==ym){g={ym:ym,itens:[]};grupos.push(g);}
      g.itens.push(m);
    });
    grupos.forEach(g=>{
      const p=g.ym.split("-");
      h+='<div class="month-h"><span>'+(MESES_L[+p[1]-1]||"")+" "+(p[0]||"")+'</span>'+
         '<span class="num">'+brl(totals(g.itens))+'</span></div>'+
         '<section class="card rows">'+g.itens.map(rowHtml).join("")+'</section>';
    });
  }
  h+='<p class="sync" id="syncline"></p></div>';
  return h;
}

/* -------- próximas -------- */
function viewProximas(veh){
  const list=proximas(veh);
  let h='<div class="stack">';
  h+='<div class="sec-h"><h2>Próximas manutenções</h2></div>';
  if(!list.length){
    h+='<div class="card empty"><h3>Nada programado</h3>'+
      '<p>Ao lançar uma manutenção, preencha “próxima em km” ou “próxima data” para acompanhar aqui.</p></div>';
  }else{
    const grupos=[["crit","Vencidas"],["warn","Chegando"],["ok","Em dia"]];
    grupos.forEach(([nivel,titulo])=>{
      const g=list.filter(p=>p.st.nivel===nivel);
      if(!g.length)return;
      h+='<div class="month-h"><span>'+titulo+'</span><span class="num">'+g.length+'</span></div><section class="card rows">';
      g.forEach(p=>{
        const alvo=[];
        if(p.st.porKm)alvo.push(km(p.m.proximaKm));
        if(p.st.porData)alvo.push(fmtDate(p.m.proximaData));
        h+='<button class="row" data-open="'+p.m.id+'">'+
          '<span class="body"><span class="t">'+esc(p.m.servico)+'</span>'+
          '<span class="s">'+esc(CAT_LABEL[p.m.categoria]||"")+' · alvo '+alvo.join(" ou ")+'</span></span>'+
          '<span class="pill '+p.st.nivel+'">'+esc(p.st.texto)+'</span>'+
        '</button>';
      });
      h+='</section>';
    });
  }
  h+='<p class="sync" id="syncline"></p></div>';
  return h;
}

/* -------- gastos -------- */
function viewGastos(veh){
  const all=maintsOf(veh.id);
  const refsAll=refuelsOf(veh.id);
  const anos=Array.from(new Set(all.concat(refsAll).map(m=>(m.data||"").slice(0,4)).filter(Boolean))).sort().reverse();
  const list=gastosAno==="tudo"?all:all.filter(m=>(m.data||"").slice(0,4)===gastosAno);
  const total=totals(list);
  const totalComb=totals(gastosAno==="tudo"?refsAll:refsAll.filter(r=>(r.data||"").slice(0,4)===gastosAno));

  // por categoria (ranqueado, magnitude → uma cor só)
  const porCat=CATEGORIAS.map(c=>{
    const g=list.filter(m=>m.categoria===c.slug);
    return {label:c.label,total:totals(g),n:g.length};
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const maxCat=porCat.length?porCat[0].total:0;

  // por mês (12 meses do ano selecionado, ou últimos 12)
  const meses=[];
  if(gastosAno==="tudo"){
    const d=new Date();
    for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);
      meses.push({ym:x.toISOString().slice(0,7),lab:MESES[x.getMonth()][0].toUpperCase()});}
  }else{
    for(let i=0;i<12;i++)meses.push({ym:gastosAno+"-"+String(i+1).padStart(2,"0"),lab:MESES[i][0].toUpperCase()});
  }
  meses.forEach(m=>{m.total=totals(all.filter(x=>(x.data||"").slice(0,7)===m.ym));});
  const maxMes=Math.max.apply(null,meses.map(m=>m.total).concat([1]));
  const comGasto=meses.filter(m=>m.total>0);
  const media=comGasto.length?meses.reduce((s,m)=>s+m.total,0)/comGasto.length:0;
  if(colSel==null){
    let bi=0;meses.forEach((m,i)=>{if(m.total>meses[bi].total)bi=i;});colSel=bi;
  }
  const sel=meses[Math.min(colSel,meses.length-1)];

  let h='<div class="stack">';
  h+='<section class="card odo" style="gap:10px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'+
        '<div><div class="eyebrow">Gasto com manutenção</div>'+
        '<div class="num" style="font-size:30px;font-weight:600;line-height:1.1">'+brl(total)+'</div></div>'+
        '<select id="gano" style="width:auto;min-width:118px">'+
          '<option value="tudo">Tudo</option>'+anos.map(a=>'<option value="'+a+'">'+a+'</option>').join("")+
        '</select>'+
      '</div>'+
      '<div class="odo-strip">'+
        '<div><div class="k">Lançamentos</div><div class="v">'+list.length+'</div></div>'+
        '<div><div class="k">Média/mês</div><div class="v">'+brlShort(media)+'</div></div>'+
        '<div><div class="k">Maior</div><div class="v">'+brlShort(list.length?Math.max.apply(null,list.map(m=>m.valorTotal||0)):0)+'</div></div>'+
      '</div>'+
    '</section>';

  h+='<div class="sec-h"><h2>Custo de rodagem</h2></div>'+
    '<section class="card odo" style="padding:12px">'+
      '<div class="odo-strip">'+
        '<div><div class="k">Manutenção</div><div class="v">'+brlShort(total)+'</div></div>'+
        '<div><div class="k">Combustível</div><div class="v">'+brlShort(totalComb)+'</div></div>'+
        '<div><div class="k">Total</div><div class="v">'+brlShort(total+totalComb)+'</div></div>'+
      '</div>'+
    '</section>';

  h+='<div class="sec-h"><h2>Manutenção por mês</h2></div>'+
    '<section class="card">'+
      '<div class="chart-cap"><span class="k">'+(sel?(MESES_L[+sel.ym.slice(5,7)-1]+" "+sel.ym.slice(0,4)):"—")+'</span>'+
        '<span class="v">'+brl(sel?sel.total:0)+'</span></div>'+
      '<div class="cols" id="cols">'+meses.map((m,i)=>
        '<button class="col" data-col="'+i+'" aria-pressed="'+(i===colSel)+'" aria-label="'+esc(MESES_L[+m.ym.slice(5,7)-1]+" "+m.ym.slice(0,4)+": "+brl(m.total))+'">'+
        '<i style="height:'+Math.max(3,Math.round(m.total/maxMes*100))+'%"></i></button>').join("")+'</div>'+
      '<div class="col-x">'+meses.map(m=>'<span>'+m.lab+'</span>').join("")+'</div>'+
    '</section>';

  h+='<div class="sec-h"><h2>Por categoria</h2></div>';
  if(!porCat.length){
    h+='<div class="card empty"><h3>Sem gastos no período</h3><p>Escolha outro período ou registre uma manutenção.</p></div>';
  }else{
    h+='<section class="card bars">'+porCat.map(c=>
      '<div class="bar-row"><div class="lab"><span class="n">'+esc(c.label)+' <span class="p">'+c.n+'×</span></span>'+
      '<span class="v">'+brl(c.total)+' <span class="p">'+Math.round(c.total/total*100)+'%</span></span></div>'+
      '<div class="track"><i style="width:'+Math.max(2,Math.round(c.total/maxCat*100))+'%"></i></div></div>').join("")+'</section>';
  }
  h+='<p class="sync" id="syncline"></p></div>';
  return h;
}

/* -------- tanque -------- */
function refuelRowHtml(a,consumo){
  const p=(a.data||"----------").split("-");
  return '<button class="row" data-ab="'+a.id+'">'+
    '<span class="when"><span class="d">'+p[2]+'</span><span class="m">'+(MESES[+p[1]-1]||"")+'</span></span>'+
    '<span class="body"><span class="t">'+esc(a.posto||COMB_LABEL[a.combustivel]||"Abastecimento")+'</span>'+
      '<span class="s">'+esc(COMB_LABEL[a.combustivel]||"")+' · '+litrosFmt(a.litros)+' · '+km(a.km)+
      (a.tanqueCheio?"":" · parcial")+'</span></span>'+
    '<span class="val">'+brl(a.valorTotal)+(consumo?'<span class="kml">'+kmlFmt(consumo)+'</span>':'')+'</span>'+
  '</button>';
}
function viewTanque(veh){
  const refs=refuelsOf(veh.id);
  let h='<div class="stack">';
  if(!refs.length){
    h+='<div class="card empty" style="padding-top:30px">'+
      '<div style="color:var(--accent);display:flex;justify-content:center;margin-bottom:10px">'+
      '<svg class="i" viewBox="0 0 24 24" style="width:42px;height:42px;stroke-width:1.3">'+ICON.tanque+'</svg></div>'+
      '<h3>Nenhum abastecimento</h3>'+
      '<p>Registre cada ida ao posto para acompanhar o consumo real e quanto o carro gasta de combustível.</p>'+
      '<button class="btn primary" id="tkNew">Registrar abastecimento</button></div>';
    return h+'<p class="sync" id="syncline"></p></div>';
  }
  const c=consumos(veh.id);
  const mes=today().slice(0,7);
  const litros=refs.reduce((s,a)=>s+(a.litros||0),0);
  const gastoMes=totals(refs.filter(a=>(a.data||"").slice(0,7)===mes));
  const medido=c.media>0, estimando=!medido&&c.est.pronta;
  const kml=medido?c.media:(estimando?c.est.media:0);
  const custoKm=medido?c.custoKm:(estimando&&c.est.dist?c.est.valor/c.est.dist:0);
  const aviso=hintConsumo(c);

  h+='<section class="card odo">'+
    '<div class="odo-top">'+
      '<div><div class="eyebrow">'+(estimando?"Consumo estimado":"Consumo médio")+'</div>'+
        '<div class="odo-km" style="margin-top:4px"><b class="num">'+
        (kml?kml.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}):"—")+
        '</b><small>km/L</small></div></div>'+
      '<div style="text-align:right"><div class="eyebrow">Custo/km</div>'+
        '<div class="num" style="font-size:18px;font-weight:600;margin-top:6px">'+
        (custoKm?"R$ "+custoKm.toFixed(2).replace(".",","):"—")+'</div></div>'+
    '</div>'+
    (aviso?'<div class="odo-sub">'+esc(aviso)+'</div>':'')+
    (kml?'<div><button class="link" id="tkConta">Ver como foi calculado</button></div>':'')+
    '<div class="odo-strip">'+
      '<div><div class="k">Abastecimentos</div><div class="v">'+refs.length+'</div></div>'+
      '<div><div class="k">Litros</div><div class="v">'+Math.round(litros).toLocaleString("pt-BR")+'</div></div>'+
      '<div><div class="k">Gasto no mês</div><div class="v">'+brlShort(gastoMes)+'</div></div>'+
    '</div>'+
  '</section>';

  h+='<div class="sec-h"><h2>Abastecimentos</h2><button class="link" id="tkNew">Registrar</button></div>';
  const lista=refs.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.km||0)-(a.km||0));
  const grupos=[];
  lista.forEach(a=>{
    const ym=(a.data||"").slice(0,7);
    let g=grupos[grupos.length-1];
    if(!g||g.ym!==ym){g={ym:ym,itens:[]};grupos.push(g);}
    g.itens.push(a);
  });
  grupos.forEach(g=>{
    const p=g.ym.split("-");
    h+='<div class="month-h"><span>'+(MESES_L[+p[1]-1]||"")+" "+(p[0]||"")+'</span>'+
       '<span class="num">'+brl(totals(g.itens))+'</span></div>'+
       '<section class="card rows">'+g.itens.map(a=>refuelRowHtml(a,c.porId[a.id])).join("")+'</section>';
  });
  h+='<p class="sync" id="syncline"></p></div>';
  return h;
}

/* Diz por que ainda não há número, e o que falta para haver. */
function hintConsumo(c){
  if(c.media>0)return "";
  if(c.est.pronta)
    return "Estimado pela série toda, porque não há dois tanques cheios seguidos. "+
           "Fica mais preciso a cada abastecimento; para um número exato, encha o tanque duas vezes.";
  const falta=[];
  if(c.est.faltaN)falta.push(c.est.faltaN+" abastecimento"+(c.est.faltaN===1?"":"s"));
  if(c.est.faltaKm)falta.push(km(c.est.faltaKm));
  return "Encha o tanque em dois abastecimentos para medir o consumo"+
    (falta.length?" — ou registre mais "+falta.join(" e ")+" para ver uma estimativa.":".");
}
function openConta(veh){
  const c=consumos(veh.id);
  let corpo;
  if(c.media>0){
    corpo='<p class="hint" style="font-size:12.5px">Cada trecho vai de um tanque cheio ao seguinte. '+
      'Os litros de abastecimentos parciais entram no trecho em que foram gastos.</p>'+
      '<section class="card rows" style="overflow:hidden">'+
      Object.keys(c.trechos).map(id=>{
        const t=c.trechos[id];
        return '<div class="row" style="display:block">'+
          '<span class="t">'+km(t.dist)+' ÷ '+litrosFmt(t.litros)+' = '+kmlFmt(c.porId[id])+'</span>'+
          '<span class="s">'+fmtDate(t.de)+' → '+fmtDate(t.ate)+' · '+t.n+
            ' abastecimento'+(t.n===1?"":"s")+'</span>'+
        '</div>';
      }).join("")+'</section>'+
      '<div class="total-box"><span class="k">Média geral</span><span class="v">'+kmlFmt(c.media)+'</span></div>'+
      '<p class="hint" style="font-size:12.5px">A média divide '+km(c.dist)+' por '+litrosFmt(c.litros)+
        ' de uma vez — e não é a média dos trechos, que daria peso demais aos mais curtos.</p>';
  }else{
    const e=c.est;
    corpo='<p class="hint" style="font-size:12.5px">Sem dois tanques cheios seguidos, o consumo é estimado '+
      'pela série inteira: a distância do primeiro ao último abastecimento, dividida pelos litros colocados '+
      'depois do primeiro.</p>'+
      '<div class="det-grid">'+
        '<div><div class="k">Distância</div><div class="v num">'+km(e.dist)+'</div></div>'+
        '<div><div class="k">Litros contados</div><div class="v num">'+litrosFmt(e.litros)+'</div></div>'+
        '<div><div class="k">Abastecimentos</div><div class="v num">'+e.n+'</div></div>'+
        '<div><div class="k">Estimativa</div><div class="v num">'+kmlFmt(e.media)+'</div></div>'+
      '</div>'+
      '<p class="hint" style="font-size:12.5px">A única imprecisão é o quanto o tanque estava diferente no '+
      'primeiro e no último abastecimento. Esse erro não cresce, mas os litros somados sim — por isso a '+
      'estimativa melhora sozinha conforme você registra.</p>';
  }
  openSheet("Como o consumo é calculado",corpo,'<button class="btn ghost block" data-close="1">Fechar</button>');
}

/* -------- binds da view -------- */
function bindView(veh){
  const v=$("#view");
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  v.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>openRefuelSheet(b.dataset.ab));
  const tk=$("#tkNew"); if(tk)tk.onclick=()=>openRefuelSheet(null);
  const tc=$("#tkConta"); if(tc)tc.onclick=()=>openConta(veh);
  v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();window.scrollTo(0,0);});
  const ed=$("#editVeh"); if(ed)ed.onclick=()=>openVehicleSheet(veh.id);
  const uk=$("#updKm"); if(uk)uk.onclick=()=>openKmSheet(veh);

  const fq=$("#fq");
  if(fq){
    fq.oninput=()=>{filters.q=fq.value;const p=fq.selectionStart;render();
      const n=$("#fq");if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}};
    v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filters.cat=b.dataset.cat;render();});
    const fp=$("#fper");fp.value=filters.periodo;fp.onchange=()=>{filters.periodo=fp.value;render();};
    $("#fkmin").onchange=e=>{filters.kmMin=e.target.value;render();};
    $("#fkmax").onchange=e=>{filters.kmMax=e.target.value;render();};
    const fc=$("#fclear");if(fc)fc.onclick=()=>{filters={q:"",cat:"todas",periodo:"tudo",kmMin:"",kmMax:""};render();};
  }
  const ga=$("#gano");
  if(ga){ ga.value=gastosAno; ga.onchange=()=>{gastosAno=ga.value;colSel=null;render();}; }
  v.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{colSel=+b.dataset.col;render();});
}

function openKmSheet(veh){

/* -------- lançamento -------- */
function sugestoes(campo,lista){
  const set=new Set();
  (lista||state.maints).forEach(m=>{if(m[campo])set.add(m[campo]);});
  return Array.from(set).sort();
}
function openMaintSheet(id,seed){
  const veh=activeVehicle();
  if(!veh){openVehicleSheet(null);return;}
  const m=id?state.maints.find(x=>x.id===id):null;
  const src=m||seed||{};
  const g=(k,d)=>esc(src[k]!=null&&src[k]!==""?src[k]:(d==null?"":d));
  const ultimoKm=maintsOf(veh.id)[0];
  const catAtual=src.categoria||"motor";

  openSheet(m?"Editar lançamento":"Novo lançamento",
    '<div class="grid2">'+
      '<div class="field"><label for="mdata">Data</label><input id="mdata" type="date" value="'+g("data",today())+'"></div>'+
      '<div class="field kminput"><label for="mkm">Quilometragem</label>'+
        '<input id="mkm" type="text" inputmode="numeric" placeholder="'+(veh.kmAtual||0)+'" value="'+g("km")+'"></div>'+
    '</div>'+
    '<span class="hint" style="margin-top:-8px">Odômetro hoje: '+km(veh.kmAtual||0)+(ultimoKm?" · último lançamento com "+km(ultimoKm.km):"")+'</span>'+

    '<div class="field"><label for="mcat">Categoria</label><select id="mcat">'+
      CATEGORIAS.map(c=>'<option value="'+c.slug+'"'+(catAtual===c.slug?" selected":"")+'>'+c.label+'</option>').join("")+
    '</select></div>'+

    '<div class="field"><label for="mserv">Serviço realizado</label>'+
      '<select id="mserv"></select>'+
      '<input id="mservTxt" type="text" placeholder="Descreva o serviço" style="display:none">'+
    '</div>'+

    '<div class="field"><label for="mpeca">Peça / produto trocado</label>'+
      '<input id="mpeca" type="text" list="dl-peca" placeholder="Ex.: Óleo 5W30 sintético 4L" value="'+g("peca")+'">'+
      '<datalist id="dl-peca">'+sugestoes("peca").map(s=>'<option value="'+esc(s)+'">').join("")+'</datalist></div>'+
    '<div class="field"><label for="mmarca">Marca / modelo da peça</label>'+
      '<input id="mmarca" type="text" list="dl-marca" placeholder="Ex.: Bosch" value="'+g("marcaPeca")+'">'+
      '<datalist id="dl-marca">'+sugestoes("marcaPeca").map(s=>'<option value="'+esc(s)+'">').join("")+'</datalist></div>'+

    '<div class="grid2">'+
      '<div class="field"><label for="mvp">Valor da peça</label><div class="money">'+
        '<input id="mvp" type="text" inputmode="decimal" placeholder="0,00" value="'+(src.valorPeca?String(src.valorPeca).replace(".",","):"")+'"></div></div>'+
      '<div class="field"><label for="mvm">Mão de obra</label><div class="money">'+
        '<input id="mvm" type="text" inputmode="decimal" placeholder="0,00" value="'+(src.valorMaoObra?String(src.valorMaoObra).replace(".",","):"")+'"></div></div>'+
    '</div>'+
    '<div class="total-box"><span class="k">Valor total</span><span class="v" id="mtotal">R$ 0,00</span></div>'+

    '<div class="field"><label for="mquem">Quem realizou</label>'+
      '<input id="mquem" type="text" list="dl-quem" placeholder="Oficina, concessionária ou você mesmo" value="'+g("executadoPor")+'">'+
      '<datalist id="dl-quem">'+sugestoes("executadoPor").map(s=>'<option value="'+esc(s)+'">').join("")+'</datalist></div>'+

    '<div class="field"><label>Próxima manutenção</label>'+
      '<div class="grid2">'+
        '<div class="kminput"><input id="mpkm" type="text" inputmode="numeric" placeholder="em km"></div>'+
        '<input id="mpdata" type="date" value="'+g("proximaData")+'">'+
      '</div><span class="hint" id="mpHint"></span></div>'+

    '<div class="field"><label>Foto da nota / comprovante</label>'+
      '<div id="photoBox"></div>'+
      '<input id="mfile" type="file" accept="image/*" capture="environment" hidden>'+
      '<span class="hint">A foto é comprimida no próprio celular antes de ser guardada.</span></div>'+
    '<div class="field"><label for="mlink">Link da nota (opcional)</label>'+
      '<input id="mlink" type="url" inputmode="url" placeholder="https://…" value="'+g("comprovante")+'"></div>'+
    '<div class="field"><label for="mobs">Observações</label>'+
      '<textarea id="mobs" placeholder="Detalhes, garantia, o que o mecânico falou…">'+g("observacoes")+'</textarea></div>',

    '<button class="btn ghost" data-close="1">Cancelar</button><button class="btn primary" id="msave">Salvar lançamento</button>');
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);

  const selCat=$("#mcat"), selServ=$("#mserv"), txtServ=$("#mservTxt");

  /* foto */
  let fotoAtual=null, fotoMudou=false;
  function pintarFoto(){
    const box=$("#photoBox");if(!box)return;
    if(fotoAtual){
      box.innerHTML='<div class="photo-wrap"><img alt="Comprovante" src="'+fotoAtual+'">'+
        '<button type="button" class="rm" id="fotoRm" aria-label="Remover foto">'+svg("close")+'</button></div>';
      $("#fotoRm").onclick=()=>{fotoAtual=null;fotoMudou=true;pintarFoto();};
    }else{
      box.innerHTML='<button type="button" class="photo-slot" id="fotoAdd">'+svg("cam")+
        '<span class="t"><b>Fotografar a nota</b>ou escolher uma imagem da galeria</span>'+svg("chev")+'</button>';
      $("#fotoAdd").onclick=()=>$("#mfile").click();
    }
  }
  $("#mfile").onchange=async e=>{
    const f=e.target.files&&e.target.files[0];e.target.value="";
    if(!f)return;
    const box=$("#photoBox");box.innerHTML='<div class="photo-ph">Comprimindo a foto…</div>';
    try{ fotoAtual=await comprimirFoto(f); fotoMudou=true; }
    catch(err){ toast(err.message==="grande"?"Foto muito pesada mesmo comprimida — tente outra.":"Não deu para ler essa imagem."); }
    pintarFoto();
  };
  pintarFoto();
  if(m&&m.temFoto){
    $("#photoBox").innerHTML='<div class="photo-ph">Carregando a foto…</div>';
    lerFoto(m.id).then(d=>{ if(d&&!fotoMudou){fotoAtual=d;} pintarFoto(); });
  }

  function fillServ(){
    const opts=SERVICOS[selCat.value]||[];
    const atual=src.categoria===selCat.value?src.servico:null;
    const known=opts.some(o=>o[0]===atual);
    selServ.innerHTML=opts.map(o=>'<option value="'+esc(o[0])+'"'+(atual===o[0]?" selected":"")+'>'+esc(o[0])+'</option>').join("")+
      '<option value="__outro"'+(atual&&!known?" selected":"")+'>Outro (digitar)…</option>';
    if(atual&&!known){txtServ.style.display="";txtServ.value=atual;}
    else{txtServ.style.display="none";}
    sugerirProxima();
  }
  function sugerirProxima(){
    const opts=SERVICOS[selCat.value]||[];
    const found=opts.find(o=>o[0]===selServ.value);
    const kmBase=parseKm($("#mkm").value)||veh.kmAtual||0;
    const hint=$("#mpHint");
    if(m)$("#mpkm").value=m.proximaKm||"";
    else if(found&&found[1]&&kmBase){$("#mpkm").value=kmBase+found[1];}
    hint.textContent=found&&found[1]?("Sugestão: a cada "+found[1].toLocaleString("pt-BR")+" km. Ajuste ou apague se não quiser lembrete."):
      "Deixe em branco se não quiser acompanhar este item.";
  }
  function calcTotal(){
    const t=Math.round((parseMoney($("#mvp").value)+parseMoney($("#mvm").value))*100)/100;
    $("#mtotal").textContent=brl(t);
    return t;
  }
  selCat.onchange=fillServ;
  selServ.onchange=()=>{
    txtServ.style.display=selServ.value==="__outro"?"":"none";
    if(selServ.value==="__outro")txtServ.focus();
    sugerirProxima();
  };
  $("#mkm").oninput=()=>{ if(!m)sugerirProxima(); };
  $("#mvp").oninput=calcTotal; $("#mvm").oninput=calcTotal;
  fillServ(); calcTotal();

  $("#msave").onclick=async()=>{
    const servico = selServ.value==="__outro"?txtServ.value.trim():selServ.value;
    if(!servico){toast("Descreva o serviço realizado");return;}
    const kmv=parseKm($("#mkm").value);
    if(kmv==null){toast("Informe a quilometragem");return;}
    const vp=parseMoney($("#mvp").value), vm=parseMoney($("#mvm").value);
    const rec={
      id:m?m.id:undefined, vehicleId:veh.id,
      data:$("#mdata").value||today(), km:kmv,
      categoria:selCat.value, servico:servico,
      peca:$("#mpeca").value.trim(), marcaPeca:$("#mmarca").value.trim(),
      valorPeca:vp, valorMaoObra:vm, valorTotal:Math.round((vp+vm)*100)/100,
      executadoPor:$("#mquem").value.trim(),
      proximaKm:parseKm($("#mpkm").value)||null,
      proximaData:$("#mpdata").value||null,
      comprovante:$("#mlink").value.trim(),
      observacoes:$("#mobs").value.trim(),
      temFoto:!!fotoAtual,
      createdAt:m?m.createdAt:Date.now(), updatedAt:Date.now()
    };
    const btn=$("#msave");btn.disabled=true;
    try{
      const salvo=await putMaint(rec);
      if(fotoMudou){
        if(fotoAtual){ btn.textContent="Enviando a foto…"; await gravarFoto(salvo.id,fotoAtual); }
        else if(m){ await apagarFoto(salvo.id); }
        render();
      }
      closeSheet(); toast(m?"Lançamento atualizado":"Manutenção registrada");
    }catch(e){ toast(e.message); }
    finally{ btn.disabled=false; btn.textContent="Salvar lançamento"; }
  };
}

/* -------- abastecimento -------- */
function combPadrao(veh){
  const ult=refuelsOf(veh.id).slice(-1)[0];
  if(ult)return ult.combustivel;
  return {Gasolina:"gasolina",Etanol:"etanol",Diesel:"diesel",GNV:"gnv"}[veh.combustivel]||"gasolina";
}
/* Quem sempre abastece do mesmo jeito não deve ter que corrigir o seletor toda vez. */
function cheioPadrao(veh){
  const ult=refuelsOf(veh.id).slice(-1)[0];
  return ult?ult.tanqueCheio:true;
}
function openRefuelSheet(id){
  const r=id?state.refuels.find(x=>x.id===id):null;
  const veh=(r&&state.vehicles.find(v=>v.id===r.vehicleId))||activeVehicle();

  const ultimo=refuelsOf(veh.id).filter(x=>!r||x.id!==r.id).slice(-1)[0];
  const combAtual=r?r.combustivel:combPadrao(veh);

      TIPOS_COMB.map(c=>'<option value="'+c.slug+'"'+(combAtual===c.slug?" selected":"")+'>'+c.label+'</option>').join("")+
    '</select></div>'+

      '<div class="field kminput"><label for="alitros">Litros</label>'+

      '<div class="field"><label for="apreco">Preço por litro</label><div class="money">'+

/* -------- baixar um arquivo -------- */
function entregarArquivo(nome,conteudo,tipo){
  try{
    const blob=new Blob([conteudo],{type:(tipo||"text/plain")+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=nome;a.style.display="none";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    toast("Arquivo gerado: "+nome);
  }catch(e){ toast("Não foi possível gerar o arquivo neste navegador."); }
}

/* -------- base de dados (tabela + exportação) -------- */
const COLUNAS=[
  {k:"veiculo",t:"Veículo"},{k:"data",t:"Data"},{k:"km",t:"KM",n:true},
  {k:"categoria",t:"Categoria"},{k:"servico",t:"Serviço"},{k:"peca",t:"Peça"},
  {k:"marcaPeca",t:"Marca"},{k:"valorPeca",t:"Peça R$",n:true},
  {k:"valorMaoObra",t:"Mão de obra R$",n:true},{k:"valorTotal",t:"Total R$",n:true},
  {k:"executadoPor",t:"Quem realizou"},{k:"proximaKm",t:"Próx. km",n:true},
  {k:"proximaData",t:"Próx. data"},{k:"temFoto",t:"Comprovante"},{k:"observacoes",t:"Observações"}
];
function linhasBase(){
  const nomeVeh=id=>{const v=state.vehicles.find(x=>x.id===id);return v?v.nome:"—";};
  return state.maints.slice()
    .sort((a,b)=>(b.data||"").localeCompare(a.data||""))
    .map(m=>({veiculo:nomeVeh(m.vehicleId),data:m.data||"",km:m.km||0,
      categoria:CAT_LABEL[m.categoria]||m.categoria||"",servico:m.servico||"",peca:m.peca||"",
      marcaPeca:m.marcaPeca||"",valorPeca:m.valorPeca||0,valorMaoObra:m.valorMaoObra||0,
      valorTotal:m.valorTotal||0,executadoPor:m.executadoPor||"",proximaKm:m.proximaKm||"",
      proximaData:m.proximaData||"",temFoto:m.temFoto?"sim":"",observacoes:m.observacoes||""}));
}
const COLUNAS_AB=[
  {k:"veiculo",t:"Veículo"},{k:"data",t:"Data"},{k:"km",t:"KM",n:true},
  {k:"combustivel",t:"Combustível"},{k:"litros",t:"Litros",n:true,d:2},
  {k:"precoLitro",t:"R$/litro",n:true,d:3},{k:"valorTotal",t:"Total R$",n:true},
  {k:"tanque",t:"Tanque"},{k:"consumo",t:"km/L",n:true,d:1},
  {k:"posto",t:"Posto"},{k:"observacoes",t:"Observações"}
];
function linhasAbast(){
  const nomeVeh=id=>{const v=state.vehicles.find(x=>x.id===id);return v?v.nome:"—";};
  const porId={};
  state.vehicles.forEach(v=>Object.assign(porId,consumos(v.id).porId));
  return state.refuels.slice()
    .sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.km||0)-(a.km||0))
    .map(a=>({veiculo:nomeVeh(a.vehicleId),data:a.data||"",km:a.km||0,
      combustivel:COMB_LABEL[a.combustivel]||a.combustivel||"",litros:a.litros||0,
      precoLitro:a.precoLitro||"",valorTotal:a.valorTotal||0,tanque:a.tanqueCheio?"cheio":"parcial",
      consumo:porId[a.id]?Math.round(porId[a.id]*10)/10:"",posto:a.posto||"",observacoes:a.observacoes||""}));
}
function openDatabase(){
  const ehAb=dbAba==="abast";
  const cols=ehAb?COLUNAS_AB:COLUNAS;
  const linhas=ehAb?linhasAbast():linhasBase();
  const nome=ehAb?"abastecimento":"lançamento";
  const cel=(r,c)=>{
    if(c.k==="data"||c.k==="proximaData")return r[c.k]?fmtDate(r[c.k]):"";
    if(c.n){
      if(r[c.k]===""||r[c.k]==null)return "";
      const casas=c.d!=null?c.d:(c.k.indexOf("valor")===0?2:0);
      return Number(r[c.k]).toLocaleString("pt-BR",
        {minimumFractionDigits:casas,maximumFractionDigits:c.d!=null?c.d:2});
    }
    return r[c.k];
  };
  const corpo=linhas.length
    ? '<div class="tbl-wrap"><table class="db"><thead><tr>'+
        cols.map(c=>'<th>'+c.t+'</th>').join("")+'</tr></thead><tbody>'+
        linhas.map(r=>'<tr>'+cols.map(c=>'<td class="'+(c.n?"n":(c.k==="servico"||c.k==="posto"?"strong":""))+'">'+
          esc(cel(r,c))+'</td>').join("")+'</tr>').join("")+
      '</tbody></table></div>'
    : '<div class="card empty"><h3>Base vazia</h3><p>Registre '+
        (ehAb?"o primeiro abastecimento":"a primeira manutenção")+' para ver a tabela aqui.</p></div>';
  openSheet("Base de dados",
    '<div class="chips">'+[["manut","Manutenções"],["abast","Abastecimentos"]].map(([k,l])=>
      '<button class="fchip" data-dbaba="'+k+'" aria-pressed="'+(dbAba===k)+'">'+l+'</button>').join("")+'</div>'+
    '<p class="hint" style="font-size:12.5px">'+linhas.length+' '+nome+(linhas.length===1?"":"s")+
      ' de '+state.vehicles.length+' veículo'+(state.vehicles.length===1?"":"s")+
      '. Arraste a tabela para o lado para ver todas as colunas.</p>'+corpo,
    '<button class="btn ghost" data-close="1">Fechar</button>'+
    '<button class="btn primary" id="dbCsv">Exportar Excel</button>');
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  $("#modal").querySelectorAll("[data-dbaba]").forEach(b=>b.onclick=()=>{dbAba=b.dataset.dbaba;openDatabase();});
  $("#dbCsv").onclick=()=>{
    const q=v=>{const s=String(v==null?"":v).replace(/"/g,'""');return /[";\n]/.test(s)?'"'+s+'"':s;};
    const nBr=v=>String(v).replace(".",",");
    const linhasCsv=[cols.map(c=>q(c.t)).join(";")].concat(
      linhas.map(r=>cols.map(c=>{
        if(c.k==="data"||c.k==="proximaData")return q(r[c.k]?fmtDate(r[c.k]):"");
        if(c.n)return r[c.k]===""||r[c.k]==null?"":nBr(r[c.k]);
        return q(r[c.k]);
      }).join(";")));
    entregarArquivo("caderneta-"+(ehAb?"abastecimentos-":"")+today()+".csv","﻿"+linhasCsv.join("\r\n"),"text/csv");
  };
}

  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  $("#impGo").onclick=async()=>{
    let d;try{d=JSON.parse($("#imp").value);}catch(e){toast("JSON inválido");return;}
    if(!d||!Array.isArray(d.vehicles)){toast("Backup não reconhecido");return;}
    const btn=$("#impGo");btn.disabled=true;btn.textContent="Importando…";
    try{
      const mapa={};
      for(const v of d.vehicles){
        const novo=await api("/vehicles",{method:"POST",body:Object.assign({},v,{id:undefined})});
        mapa[v.id]=novo.veiculo.id;

        const vid=mapa[m.vehicleId]||state.settings.activeVehicle;
        if(!vid)continue;
        await api("/maintenances",{method:"POST",body:Object.assign({},m,{id:undefined,vehicleId:vid})});
      }
      for(const a of (d.refuels||[])){
        const vid=mapa[a.vehicleId]||state.settings.activeVehicle;
        if(!vid)continue;
        await api("/refuels",{method:"POST",body:Object.assign({},a,{id:undefined,vehicleId:vid})});
      }
      await carregarTudo(); closeSheet(); render(); toast("Backup importado");
    }catch(e){ toast(e.message); }
    finally{ btn.disabled=false; btn.textContent="Importar"; }
  };
}

/* ============================== boot ============================== */
$("#fab").onclick=()=>{ activeVehicle()?openNovo():openVehicleSheet(null); };
$("#vehBtn").onclick=()=>{ state.vehicles.length?openVehiclePicker():openVehicleSheet(null); };
$("#cfgBtn").onclick=openSettings;
$("#authAlt").onclick=()=>{ modoAuth=modoAuth==="criar"?"entrar":"criar"; pintarAuth(); };
$("#authForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=$("#authGo"), caixa=$("#authErro");
  const criando=modoAuth==="criar";
  btn.disabled=true; btn.textContent=criando?"Criando…":"Entrando…";
  try{
    const corpo={email:$("#aEmail").value.trim(),senha:$("#aSenha").value};
    if(criando){corpo.nome=$("#aNome").value.trim();corpo.convite=$("#aConvite").value.trim();}
    const r=await fetch("/api/auth/"+(criando?"register":"login"),
      {method:"POST",headers:{"Content-Type":"application/json"},
       credentials:"same-origin",body:JSON.stringify(corpo)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.erro||"Não foi possível entrar agora.");
    usuario={id:d.id,email:d.email,nome:d.nome};
    $("#aSenha").value="";
    esconderLogin();
    await carregarTudo();
    render();
  }catch(err){
    caixa.textContent=err.message; caixa.hidden=false;
  }finally{
    btn.disabled=false; btn.textContent=criando?"Criar conta":"Entrar";
  }
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeSheet(); });

carregarPref();
render();
iniciar();
})();
</script>
</body>
</html>
